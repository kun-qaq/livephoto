name: Build & Release

on:
  push:
    tags: ["v*"]
  # 允许手动触发做打包/冒烟验证, 不产生 Release
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      # 用 build_winui3.spec 打包, 与本地发布版同一套参数。
      # 注意: GUI 依赖仓库外的共享骨架 ../winui3_ui, CI 上需先提供该目录;
      # 正式发布用的 exe 仍以本地验证过的打包结果为准。
      - name: Build exe
        run: pyinstaller --noconfirm build_winui3.spec

      - name: Smoke test (CLI convert)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -c "import imageio_ffmpeg,subprocess; subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-y','-f','lavfi','-i','testsrc=size=320x240:rate=15:duration=2','-c:v','libx264','-pix_fmt','yuv420p','t.mp4'], check=True)"

          # GUI-subsystem exe 的 stdout 在 CI 里是 None, 用 LIVEPHOTO_LOG 落盘才能看到真实报错。
          $env:LIVEPHOTO_LOG = "dist\smoke_log.txt"
          # 用 Python subprocess 启动 GUI-subsystem exe: 正确等待退出并逐项传参,
          # 绕开 PowerShell Start-Process -ArgumentList 的 "Error splitting the argument list" 解析坑。
          python -c "import subprocess,sys; r=subprocess.run([r'.\dist\LivePhotoMaker.exe','t.mp4','-n','CI_SMOKE']); print('exe exit',r.returncode); sys.exit(r.returncode)"

          if (Test-Path "dist\smoke_log.txt") { Write-Host "--- exe log ---"; Get-Content "dist\smoke_log.txt" | Write-Host }
          if (Test-Path "dist\output") { Write-Host "--- dist\output ---"; Get-ChildItem "dist\output" | Format-Table Name,Length | Out-String | Write-Host } else { Write-Host "--- no dist\output ---" }

          if (-not (Test-Path "dist\output\CI_SMOKE.MOV")) { throw "smoke test failed: no output file" }

      # 说明: 这里只做「能否打包 + 转换是否跑通」的质量门禁, 不自动上传发布物。
      # 发布用的 exe 在本地打包(同一份 spec), GUI 与 CLI 都实测过再由发布脚本上传,
      # 避免 CI 产物在未验证 GUI 的情况下覆盖 Release 资产。
