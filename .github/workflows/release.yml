name: Build & Release

on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pillow imageio-ffmpeg pyinstaller

      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name LivePhotoMaker `
            --icon icon.ico `
            --collect-data imageio_ffmpeg `
            --exclude-module imageio `
            --exclude-module numpy `
            --exclude-module matplotlib `
            livephoto.py

      - name: Smoke test (CLI convert)
        shell: pwsh
        run: |
          python -c "import imageio_ffmpeg,subprocess; subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-y','-f','lavfi','-i','testsrc=size=320x240:rate=15:duration=2','-c:v','libx264','-pix_fmt','yuv420p','t.mp4'], check=True)"
          .\dist\LivePhotoMaker.exe t.mp4 -n CI_SMOKE
          if (-not (Test-Path "dist\output\CI_SMOKE.MOV")) { throw "smoke test failed" }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LivePhotoMaker.exe
