name: Build & Release

on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pillow imageio-ffmpeg sv-ttk pywinstyles pyinstaller

      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name LivePhotoMaker `
            --icon icon.ico `
            --collect-data imageio_ffmpeg `
            --collect-data sv_ttk `
            --exclude-module imageio `
            --exclude-module numpy `
            --exclude-module matplotlib `
            livephoto.py

      - name: Smoke test (CLI convert)
        shell: pwsh
        run: |
          python -c "import imageio_ffmpeg,subprocess; subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-y','-f','lavfi','-i','testsrc=size=320x240:rate=15:duration=2','-c:v','libx264','-pix_fmt','yuv420p','t.mp4'], check=True)"
          # pwsh does not wait for GUI-subsystem exes; use Start-Process -Wait
          # ArgumentList 必须是单个字符串, 数组会触发 "Error splitting the argument list"
          $p = Start-Process -FilePath ".\dist\LivePhotoMaker.exe" -ArgumentList "t.mp4 -n CI_SMOKE" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exe exited with code $($p.ExitCode)" }
          if (-not (Test-Path "dist\output\CI_SMOKE.MOV")) { throw "smoke test failed: no output file" }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LivePhotoMaker.exe
